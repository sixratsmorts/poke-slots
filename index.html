<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poké Slots">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#17122b}body{margin:0}</style>
<title>Poké Slots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Chiffre5';font-weight:100 900;unicode-range:U+0035;src:local('Menlo'),local('Menlo Regular'),local('Consolas'),local('Courier New'),local('Courier'),local('DejaVu Sans Mono'),local('Arial'),local('Helvetica')}
:root{
  --bg:#17122b; --surface:#241c45; --surface2:#31275c; --line:#4b3f8a;
  --ink:#f5efe0; --mute:#a99fd0; --gold:#ffe27a; --gold2:#ffc93c; --good:#6ee06a; --bad:#ff6a5e; --teal:#38e0c0;
  --font-d:'Chiffre5','Press Start 2P',ui-monospace,Menlo,monospace;
  --font-b:'Chiffre5','Pixelify Sans',ui-monospace,Menlo,monospace;
  --cell:clamp(54px,min(21vw,calc((100vh - 470px)/3)),118px);
  color-scheme:dark;
}
@supports (height:100dvh){:root{--cell:clamp(54px,min(21vw,calc((100dvh - 470px)/3)),118px)}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.25;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
img{image-rendering:crisp-edges;image-rendering:pixelated}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:fixed;top:0;bottom:0;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0;padding:8px 0 6px;gap:7px}
.btn{display:inline-block;font-family:var(--font-d);font-size:10px;letter-spacing:.03em;line-height:1.4;padding:10px 12px;background:var(--ink);color:#1c1530;border:0;border-radius:4px;box-shadow:0 4px 0 #8d84b8;text-align:center;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8d84b8}
.btn.alt{background:var(--surface2);color:var(--ink);box-shadow:0 4px 0 #120e24}
.btn.sm{font-size:9px;padding:8px 10px}
.btn.off{opacity:.35;pointer-events:none}
.btn.on{background:var(--gold2);color:#1c1530;box-shadow:0 4px 0 #a8801a}
.lab{font-family:var(--font-d);font-size:7px;color:var(--mute);letter-spacing:.06em;display:block}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0;font-family:var(--font-d);font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #6a3fbf;letter-spacing:.04em;text-align:center;flex:1}
.stats{display:grid;grid-template-columns:1.3fr 1.2fr .8fr;gap:6px}
.st{background:var(--surface);border:2px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0}
.st b{font-family:var(--font-d);font-size:12px;color:var(--ink);display:block;margin-top:3px;white-space:nowrap}
.st.coin b{color:var(--gold)}
.pbar{height:8px;background:#0d0a1c;border:1px solid var(--line);border-radius:2px;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .5s}
#fsbar{background:linear-gradient(90deg,#1fb86a,#7be06a);color:#10301c;font-family:var(--font-d);font-size:9px;line-height:1.5;padding:6px 8px;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:6px;animation:fsglow 1s infinite alternate}
@keyframes fsglow{from{box-shadow:0 0 4px #7be06a}to{box-shadow:0 0 16px #b8ff9a}}
#buffs{display:flex;gap:5px;flex-wrap:wrap;min-height:0}
.buff{font-family:var(--font-d);font-size:7px;background:var(--surface2);border:1px solid var(--gold2);color:var(--gold);padding:4px 6px;border-radius:3px}

.cab{position:relative;background:linear-gradient(#3a2a78,#241c45);border:3px solid var(--gold2);border-radius:10px;padding:8px 10px 10px;box-shadow:0 0 0 3px #15102a,0 6px 0 #a8801a,inset 0 0 18px #0008;flex:none}
.marq{height:8px;margin:0 0 7px;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 16px);opacity:.9;animation:marq .6s steps(2) infinite;border-radius:2px}
@keyframes marq{50%{background-position:8px 0}}
.rwrap{position:relative;display:flex;justify-content:center}
.reels{display:flex;gap:6px;background:#0d0a1c;padding:6px;border-radius:6px;border:3px solid #15102a;box-shadow:inset 0 0 14px #000}
.reel{width:var(--cell);height:calc(var(--cell)*3);overflow:hidden;background:linear-gradient(#e9e2ff 0,#fff 18%,#fff 82%,#e9e2ff 100%);border-radius:3px;position:relative}
.reel::after{content:'';position:absolute;inset:0;background:linear-gradient(#0009 0,transparent 20%,transparent 80%,#0009 100%);pointer-events:none}
.reel.tense{animation:tense .25s infinite alternate}
@keyframes tense{from{box-shadow:inset 0 0 0 3px var(--gold2)}to{box-shadow:inset 0 0 0 3px #fff0}}
.strip{will-change:transform}
.cell{height:var(--cell);display:flex;align-items:center;justify-content:center;border-bottom:1px solid #0001}
.cell img{width:78%;height:78%;object-fit:contain}
.cell.hit{animation:hit .5s infinite alternate;background:#fff7c2;z-index:1;position:relative}
.reel.dim .cell:not(.hit) img{opacity:.35}
@keyframes hit{from{transform:scale(1)}to{transform:scale(1.1);filter:drop-shadow(0 0 6px #ffc93c)}}
#win{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;z-index:5}
#win b{display:inline-block;font-family:var(--font-d);font-size:20px;color:var(--gold);background:#15102aee;border:3px solid var(--gold2);padding:10px 16px;border-radius:8px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#evban{position:absolute;left:-4px;right:-4px;top:6px;z-index:6;text-align:center;pointer-events:none}
#evban b{display:inline-block;font-family:var(--font-d);font-size:11px;line-height:1.5;color:#fff;padding:8px 12px;border-radius:6px;border:3px solid #fff;background:linear-gradient(90deg,#d0309c,#7038f8);animation:pop .35s cubic-bezier(.2,1.6,.4,1),evpulse .5s .35s 4 alternate;text-shadow:2px 2px 0 #0006}
@keyframes evpulse{to{transform:scale(1.07)}}
#combo{min-height:14px;text-align:center;font-family:var(--font-d);font-size:8px;color:var(--teal);margin-top:7px}

.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.betbox{display:flex;align-items:center;gap:6px}
.betbox b{font-family:var(--font-d);font-size:14px;color:var(--gold);display:block;min-width:30px;text-align:center;margin-top:3px}
.spin{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#e8453c 55%,#a01c1c);border:4px solid #15102a;box-shadow:0 6px 0 #6b1212,inset 0 -6px 0 #0003;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:14px;color:#fff;text-align:center;line-height:1.5;cursor:pointer;text-shadow:2px 2px 0 #0005;flex:none}
.spin:active{transform:translateY(4px);box-shadow:0 2px 0 #6b1212}
.spin.off{filter:grayscale(.7) brightness(.7);pointer-events:none}
.spin.fs{background:radial-gradient(circle at 35% 30%,#b8ff9a,#1fb86a 55%,#0d6a38);box-shadow:0 6px 0 #0a4a28;font-size:9px}
.tog{display:flex;flex-direction:column;gap:7px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}
.nav .btn{padding:9px 4px;font-size:8px}
.nav .btn i{font-style:normal;color:var(--bad)}
.last{display:flex;gap:4px;overflow:hidden;min-height:44px;flex:none;align-items:center}
.last .lm{position:relative;width:44px;height:44px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.last .lm img{width:100%;height:100%;object-fit:contain}
.last .lm.sh{border-color:var(--gold2);box-shadow:0 0 6px var(--gold2)}
.last .lm.nw::after{content:'N';position:absolute;right:1px;top:0;font-family:var(--font-d);font-size:7px;color:var(--good)}
.hint{font-size:11px;color:var(--mute);text-align:center;flex:none}

/* Feuilles (boutique, collection, quêtes, gains) */
#sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:8px 0 6px;gap:8px;z-index:20}
.shead{display:flex;align-items:center;gap:10px}
.shead h2{margin:0;font-family:var(--font-d);font-size:13px;color:var(--gold);flex:1}
#sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;gap:10px;align-items:center}
.card .grow{flex:1;min-width:0}
.card h3{margin:0 0 3px;font-family:var(--font-d);font-size:10px;line-height:1.5;color:var(--ink)}
.card p{margin:0;font-size:12px;color:var(--mute)}
.card .odds{color:var(--gold);font-family:var(--font-d);font-size:8px;margin-top:4px;line-height:1.6}
.card img{width:40px;height:40px;flex:none}
.sec{font-family:var(--font-d);font-size:9px;color:var(--teal);margin:4px 0 0}
.price{font-family:var(--font-d);font-size:10px;color:#1c1530}
.q.done{border-color:var(--good)}
.qbar{height:7px;background:#0d0a1c;border:1px solid var(--line);margin-top:6px}
.qbar i{display:block;height:100%;background:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--font-d);font-size:8px;padding:6px 7px;border-radius:3px;display:inline-block;cursor:pointer}
.chip.dim{opacity:.4}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.dcell{position:relative;aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.dcell img{width:78%;height:78%;object-fit:contain}
.dcell small{position:absolute;left:2px;top:1px;font-size:8px;color:var(--mute)}
.dcell.un{opacity:.5}
.dcell.un span{font-family:var(--font-d);font-size:14px;color:var(--line)}
.dcell .star{position:absolute;right:2px;top:0;color:var(--gold);font-size:11px}
.gens{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.gen{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 6px;font-size:11px;color:var(--mute)}
.gen b{color:var(--ink);font-weight:600}

/* Fenêtres */
#modal{position:absolute;inset:0;z-index:30;background:#0c0919ee;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{width:min(360px,100%);background:var(--surface);border:3px solid var(--gold2);border-radius:10px;padding:16px 14px;text-align:center;display:flex;flex-direction:column;gap:10px;max-height:92%;overflow-y:auto;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.mbox h2{margin:0;font-family:var(--font-d);font-size:16px;line-height:1.5;color:var(--gold);text-shadow:2px 2px 0 #6a3fbf}
.mbox p{margin:0;color:var(--ink);font-size:14px}
.mbox .big{font-family:var(--font-d);font-size:22px;color:var(--gold)}
.mbox.fs h2{font-size:24px;background:linear-gradient(90deg,#7be06a,#fff,#7be06a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:rb 1.2s linear infinite;background-size:200% 100%}
@keyframes rb{to{background-position:200% 0}}

/* Capture */
#cap{position:absolute;inset:0;z-index:40;background:radial-gradient(circle at 50% 38%,#2a2160,#0c0919 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center}
#cap .ctop{position:absolute;top:12px;left:0;right:0;font-family:var(--font-d);font-size:9px;color:var(--mute)}
#cap .stage{position:relative;width:min(70vw,260px);height:min(70vw,260px);display:flex;align-items:center;justify-content:center}
#cap .mon{width:100%;height:100%;object-fit:contain;transition:transform .5s,opacity .5s,filter .5s}
#cap .mon.sil{filter:brightness(0) contrast(1.2);animation:wildin .6s}
#cap .mon.gone{transform:scale(.05);opacity:0;filter:brightness(4)}
@keyframes wildin{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}
#cap .ball{position:absolute;width:72px;height:72px;left:50%;top:50%;margin:-36px 0 0 -36px;opacity:0}
#cap .ball.drop{opacity:1;animation:bdrop .55s cubic-bezier(.4,0,.6,1)}
@keyframes bdrop{from{transform:translateY(-260px) rotate(-360deg)}to{transform:none}}
#cap .ball.wob{opacity:1;animation:wob .5s}
@keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(-24deg)}75%{transform:rotate(24deg)}100%{transform:rotate(0)}}
#cap .ball.gold{filter:drop-shadow(0 0 10px #ffe27a) drop-shadow(0 0 22px #ffc93c)}
#cap .ball.out{opacity:0;transition:opacity .25s,transform .25s;transform:scale(2)}
#cap .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cap .flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#cap .name{font-family:var(--font-d);font-size:15px;color:var(--ink);line-height:1.5;min-height:22px}
#cap .info{font-size:13px;color:var(--mute);min-height:18px}
#cap .tag{display:inline-block;font-family:var(--font-d);font-size:10px;padding:6px 10px;border-radius:4px;background:var(--good);color:#10301c}
#cap .tag.dup{background:var(--surface2);color:var(--mute)}
#cap .tag.sh{background:linear-gradient(90deg,#ffe27a,#ff9ad5,#7be0ff);color:#1c1530}
#cap .reveal{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#cap .sparks i{position:absolute;width:8px;height:8px;background:#fff;box-shadow:0 0 8px #ffe27a;transform:rotate(45deg);animation:spark 1.3s ease-out forwards;opacity:0}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(45deg) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(225deg) scale(.2)}}
.hunter{position:absolute;inset:0;z-index:5;background:radial-gradient(circle,#4a1d9aee,#0c0919f2 70%);display:flex;align-items:center;justify-content:center;animation:hin .25s}
@keyframes hin{from{opacity:0}to{opacity:1}}
.hunter b{font-family:var(--font-d);font-size:clamp(20px,7vw,34px);line-height:1.5;text-align:center;background:linear-gradient(90deg,#ff7a7a,#ffe27a,#7be06a,#7be0ff,#ff7a7a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 1.1s linear infinite,hshake .12s infinite alternate;filter:drop-shadow(3px 3px 0 #000)}
@keyframes hshake{from{transform:rotate(-2deg) scale(1)}to{transform:rotate(2deg) scale(1.06)}}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(#ffe27a30 0 8deg,transparent 8deg 22deg);animation:spinr 6s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.coinrain{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.coinrain i{position:absolute;top:-24px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc93c 60%,#a8801a);border:2px solid #15102a;animation:cfall 1.6s ease-in forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.marq,#fsbar,.cell.hit,.rays,.hunter b{animation:none}}
</style>
</head>
<body>
<div id="app">
<section id="main" class="screen">
  <div class="top">
    <div style="width:64px"></div>
    <h1>POKÉ SLOTS</h1>
    <div role="button" tabindex="0" class="btn alt sm" id="bSnd">♪ OUI</div>
  </div>
  <div class="stats">
    <div class="st coin"><span class="lab">PIÈCES</span><b id="coins">0</b></div>
    <div class="st"><span class="lab">POKÉDEX</span><b id="dexc">0/1025</b></div>
    <div class="st"><span class="lab">CHROMA</span><b id="shc">0</b></div>
  </div>
  <div class="pbar"><i id="pbar"></i></div>
  <div id="fsbar" hidden></div>
  <div id="buffs"></div>
  <div class="cab">
    <div class="marq"></div>
    <div class="rwrap">
      <div class="reels" id="reels">
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
      </div>
      <div id="evban" hidden></div>
      <div id="win" hidden></div>
    </div>
    <div id="combo"></div>
  </div>
  <div class="ctl">
    <div class="betbox">
      <div role="button" tabindex="0" class="btn alt" id="bMinus">−</div>
      <div><span class="lab">MISE</span><b id="bet">1</b></div>
      <div role="button" tabindex="0" class="btn alt" id="bPlus">+</div>
    </div>
    <div role="button" tabindex="0" class="spin" id="spin">SPIN</div>
    <div class="tog">
      <div role="button" tabindex="0" class="btn alt sm" id="bAuto">AUTO</div>
      <div role="button" tabindex="0" class="btn alt sm" id="bTurbo">TURBO</div>
    </div>
  </div>
  <div class="nav">
    <div role="button" tabindex="0" class="btn" id="nShop">BOUTIQUE</div>
    <div role="button" tabindex="0" class="btn" id="nColl">POKÉDEX</div>
    <div role="button" tabindex="0" class="btn" id="nQuest">QUÊTES <i id="qdot" hidden>●</i></div>
    <div role="button" tabindex="0" class="btn" id="nPay">GAINS</div>
  </div>
  <div class="last" id="last"></div>
</section>
<section id="sheet" hidden>
  <div class="shead"><div role="button" tabindex="0" class="btn alt sm" id="sBack">‹ RETOUR</div><h2 id="stitle"></h2><b id="scoins" style="font-family:var(--font-d);font-size:10px;color:var(--gold)"></b></div>
  <div id="sbody"></div>
</section>
<div id="modal" hidden></div>
<div id="cap" hidden></div>
</div>
<script>
(function(){
'use strict';

/* ---------- Types ---------- */
var T={
  no:['Normal','Nor','#a8a878'], fi:['Feu','Feu','#f08030'], wa:['Eau','Eau','#6890f0'],
  el:['Électrik','Éle','#f8d030'], gr:['Plante','Pla','#78c850'], ic:['Glace','Gla','#98d8d8'],
  fg:['Combat','Com','#c03028'], po:['Poison','Poi','#a040a0'], gd:['Sol','Sol','#e0c068'],
  fl:['Vol','Vol','#a890f0'], ps:['Psy','Psy','#f85888'], bu:['Insecte','Ins','#a8b820'],
  ro:['Roche','Roc','#b8a038'], gh:['Spectre','Spe','#705898'], dr:['Dragon','Dra','#7038f8'],
  da:['Ténèbres','Tén','#705848'], st:['Acier','Aci','#b8b8d0'], fa:['Fée','Fée','#ee99ac']
};
var TYPE_CODE={normal:'no',fire:'fi',water:'wa',electric:'el',grass:'gr',ice:'ic',fighting:'fg',poison:'po',ground:'gd',flying:'fl',psychic:'ps',bug:'bu',rock:'ro',ghost:'gh',dragon:'dr',dark:'da',steel:'st',fairy:'fa'};
var TYPE_SLUG={}; Object.keys(TYPE_CODE).forEach(function(k){TYPE_SLUG[TYPE_CODE[k]]=k;});
var TYPE_KEYS=Object.keys(T);

/* ---------- Utilitaires ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function count(o){return Object.keys(o).length;}
function rint(n){return Math.floor(Math.random()*n);}
function pickOf(a){return a[rint(a.length)];}
function lsGet(k,def){try{var s=localStorage.getItem(k);return s?JSON.parse(s):def;}catch(e){return def;}}
function lsSetNow(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var lsTimers={};
function lsSet(k,v){clearTimeout(lsTimers[k]);lsTimers[k]=setTimeout(function(){lsSetNow(k,v);},400);}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}

  return withTimeout(Promise.all([jget(API+'pokemon/'+id),jget(API+'pokemon-species/'+id)]).then(function(r){
    var types=[]; r[0].types.slice().sort(function(a,b){return a.slot-b.slot;}).forEach(function(t){var c=TYPE_CODE[t.type.name];if(c)types.push(c);});
    if(!types.length) types=['no'];

var NOTEIDX={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
function noteHz(n){
  var m=/^([a-g])(#|b)?(\d)$/.exec(n); if(!m) return 0;
  var midi=12*(+m[3]+1)+NOTEIDX[m[1]]+(m[2]==='#'?1:(m[2]==='b'?-1:0));
  return 440*Math.pow(2,(midi-69)/12);
}
function compileTrack(tr){
  if(tr.ev) return tr;
  var L=tr.lead.split(' '), B=tr.bass.split(' '), D=tr.drum.split(' ');
  tr.len=L.length; tr.ev=[];
  var i; for(i=0;i<tr.len;i++) tr.ev[i]=[];
  function voice(tokens,name){
    for(var k=0;k<tokens.length;k++){
      var t=tokens[k]; if(t==='-'||t==='.') continue;
      var f=noteHz(t); if(!f) continue;
      var n=1; while(tokens[k+n]==='.') n++;
      tr.ev[k%tr.len].push({v:name,f:f,n:n});
    }
  }
  voice(L,'lead'); voice(B,'bass');
  for(i=0;i<D.length;i++) if(D[i]==='k'||D[i]==='s'||D[i]==='h') tr.ev[i%tr.len].push({v:D[i]});

}

function playEv(e,t,sd,out){

    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.setValueAtTime(vol*0.85,t+Math.max(0.02,dur-0.05)); g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.02);
  }else if(e.v==='k'){
    o=AC.createOscillator(); g=AC.createGain(); o.type='sine';
    o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12);

function stopMusic(){

var W_F={PB:7,GB:5,UB:3,MB:1,ST:3,FS:2,WD:5,EG:2,FI:3,WA:3,GR:3};
function totalW(W){var s=0;SYMS.forEach(function(k){s+=W[k];});return s;}
function drawSym(free){
  var W=free?W_F:W_N, r=Math.random()*totalW(W);
  for(var i=0;i<SYMS.length;i++){r-=W[SYMS[i]];if(r<0)return SYMS[i];}

}

var LINES=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]];

/* Chaque ligne gagnante de 3 symboles « capture » déclenche une rencontre */

  PB:{ball:'PB',r:2},

  UB:{ball:'UB',r:8},
  MB:{ball:'MB',forceNew:true,shiny:1/10},
  ST:{ball:'ST',r:3,shiny:1/4},
  FI:{ball:'FI',r:2,type:'fi'}, WA:{ball:'WA',r:2,type:'wa'}, GR:{ball:'GR',r:2,type:'gr'}
};
function evalLine(line,g){
  var s=line.map(function(r,c){return g[c][r];});
  if(s.indexOf('FS')>-1||s.indexOf('EG')>-1) return null;
  var base=null; s.forEach(function(x){if(x!=='WD'&&!base)base=x;});
  var cells=line.map(function(r,c){return [c,r];});
  if(!base) return {sym:'MB',n:3,cells:cells,pay:TRIPLE.MB};
  if(s.every(function(x){return x===base||x==='WD';})) return {sym:base,n:3,cells:cells,pay:TRIPLE[base]};
  /* paire sur les deux premiers rouleaux (balles et étoile) */
  var a=s[0],b=s[1];
  if(a!=='EG'&&(a===b||a==='WD'||b==='WD')){
    var p=a==='WD'?b:a;
    if(PAIR[p]&&(s[2]!==p&&s[2]!=='WD')) return {sym:p,n:2,cells:cells.slice(0,2),pay:PAIR[p]};
  }
  return null;
}
function evalGrid(g){
  var wins=[], fs=0, eg=0, fsCells=[], egCells=[];
  LINES.forEach(function(L,i){var w=evalLine(L,g); if(w){w.line=i;wins.push(w);}});
  for(var c=0;c<3;c++)for(var r=0;r<3;r++){
    if(g[c][r]==='FS'){fs++;fsCells.push([c,r]);}
    if(g[c][r]==='EG'){eg++;egCells.push([c,r]);}
  }
  return {wins:wins,fs:fs,eg:eg,fsCells:fsCells,egCells:egCells};
}

  var i,list;
  if(spec.upgrade){
    list=Object.keys(DEX.seen).filter(function(k){return !DEX.shiny[k];});
    if(list.length) return +pickOf(list);
  }
  if(spec.forceNew){
    list=[];

    else{for(i=1;i<=N;i++) if(!DEX.seen[i]) list.push(i);}

function runReel(i,final,d){

  }

      else if(ev.mult){evMult=ev.mult;}
      applyEvent(ev,grid); sfx('bonus'); ui();
      showBanner('evban',esc(ev.name)+'<br><span style="font-size:8px">'+esc(ev.desc)+'</span>',1900);
      await wait(900);
    }
    sfx('start'); spinLoop(true);
    await animateReels(grid);
    spinLoop(false);
    var res=evalGrid(grid), mult=comboMult(SL.combo)*evMult*(free?SL.fsMult:1), won=0, hits=[];
    res.wins.forEach(function(w){w.amt=Math.max(1,Math.round(w.pay*bet*mult)); won+=w.amt; hits=hits.concat(w.cells);});
    if(res.fs>=3){won+=Math.max(1,Math.round(bet*mult)); hits=hits.concat(res.fsCells);}
    if(res.eg>=3){won+=Math.max(1,Math.round(2*bet*mult)); hits=hits.concat(res.egCells);}
    SL.coins+=won; if(free&&SL.fsStats) SL.fsStats.coins+=won+rain;
    if(won+rain>SL.best) SL.best=won+rain;
    if(won>0){
      hitCells(hits);
      var big=won>=bet*10;
      sfx(big?'big':'win'); if(big) coinRain(big&&won>=bet*30?40:20);
      ui();
      await showBanner('win','+'+fmt(won)+(mult>1.05?'<br><span style="font-size:8px">×'+(Math.round(mult*10)/10)+'</span>':''),1300);
    }
    /* captures */
    var caps=[];
    res.wins.forEach(function(w){if(w.n===3&&CAPSPEC[w.sym]) caps.push(Object.assign({},CAPSPEC[w.sym]));});
    if(res.eg>=3) caps.push({ball:'EG',forceNew:true,shiny:1/5,label:'ÉCLOSION !'});
    for(var i=0;i<caps.length;i++){
      var sp=caps[i]; sp.free=free; if(free&&!sp.type) sp.type=SL.fsType;
      if(!sp.label) sp.label=(SYMNAME[sp.ball]||'').toUpperCase();
      await captureSeq(sp);
      if(free&&SL.fsMult<10) SL.fsMult++;
      ui();
    }
    if(won>0||caps.length){SL.combo++;} else SL.combo=0;
    if(won>0){SL.wins++; qProg('wins',1);}
    if(SL.lure>0&&!opts.respin) SL.lure--;
    if(res.fs>=3){
      if(free){SL.fs+=5+2*(res.fs-3); sfx('fs'); ui(); await modal('<h2>RE-DÉCLENCHEMENT !</h2><p>+'+(5+2*(res.fs-3))+' FREE SPINS</p>','fs');}
      else await startFree(8+2*(res.fs-3),bet);
    }
    ui();
    if(ev&&ev.id==='respin'){
      BUSY=false; await doSpin({respin:true,free:free}); return;
    }
    if(free&&SL.fs<=0&&SL.fsStats) await endFree();
  }catch(e){ try{console.error(e);}catch(_){} }
  finally{ BUSY=false; spinLoop(false); ui(); scheduleNext(); }
}
function scheduleNext(){
  clearTimeout(nextT);
  if(BUSY||sheetOpen) return;
  if(SL.fs>0||SL.auto){
    nextT=setTimeout(function(){ if(!BUSY&&!sheetOpen&&$('#modal').hidden&&$('#cap').hidden) doSpin(); },750*SPEED());
  }
}

/* ---------- Feuilles : boutique, Pokédex, quêtes, gains ---------- */
var PACKS=[
  {id:'p1',name:'Pack Poké Ball',n:1,cost:30,ball:'PB',r:2,shiny:1/15,desc:'1 rencontre, priorité aux nouveaux'},
  {id:'p2',name:'Pack Super Ball',n:3,cost:120,ball:'GB',r:4,shiny:1/10,desc:'3 rencontres, forte chance de nouveautés'},
  {id:'p3',name:'Pack Hyper Ball',n:5,cost:450,ball:'UB',r:8,shiny:1/5,desc:'5 rencontres presque toujours inédites'},
  {id:'p4',name:'Pack Master Ball',n:1,cost:1500,ball:'MB',forceNew:true,shiny:1/2,desc:'1 Pokémon inédit garanti'},
  {id:'p5',name:'Pack Type au choix',n:3,cost:250,ball:'GB',r:3,shiny:1/8,pickType:true,desc:'3 rencontres du type de ton choix'},
  {id:'p6',name:'Pack Étoile (chroma garanti)',n:1,cost:1200,ball:'ST',upgrade:true,shiny:1,desc:'Rend chromatique un Pokémon déjà capturé'}
];
var BOOSTS=[
  {id:'lure',name:'Leurre Brillant',cost:150,desc:'20 tours : chances de chromatique ×2'},
  {id:'magnet',name:'Aimant à bonus',cost:250,desc:'15 tours : bonus aléatoires 2× plus fréquents'},
  {id:'fsbuy',name:'Achat FREE SPIN',cost:600,desc:'8 tours gratuits avec Frénésie de type'}
];
function oddsTxt(p){if(p.shiny>=1)return '100 %';var d=Math.round(1/p.shiny);return '1 sur '+d+(SL.lure>0?' (×2 : leurre actif)':'');}
function openSheet(title,render){
  sheetOpen=true; clearTimeout(nextT);
  $('#sheet').hidden=false; $('#stitle').textContent=title; $('#sheet').__render=render; render();
  $('#sbody').scrollTop=0;
}
function closeSheet(){sheetOpen=false;$('#sheet').hidden=true;$('#sheet').__render=null;ui();scheduleNext();}
function rerender(){var f=$('#sheet').__render; if(f){var y=$('#sbody').scrollTop; f(); $('#sbody').scrollTop=y;} $('#scoins').textContent=fmt(SL.coins)+' ●';}
function renderShop(){
  var h='<div class="sec">PACKS DE CAPTURE</div>';
  PACKS.forEach(function(p){
    var can=SL.coins>=p.cost&&!(p.upgrade&&count(DEX.seen)-count(DEX.shiny)<1);
    h+='<div class="card"><img alt="" src="'+SYMIMG[p.ball]+'"><div class="grow"><h3>'+p.name+'</h3><p>'+p.desc+'</p><div class="odds">✦ CHROMATIQUE : '+oddsTxt(p)+'</div></div>'+
      '<div role="button" tabindex="0" class="btn'+(can?'':' off')+'" data-buy="'+p.id+'"><span class="price">'+fmt(p.cost)+' ●</span></div></div>';
  });
  h+='<div class="sec">BOOSTS</div>';
  BOOSTS.forEach(function(b){
    var ic=b.id==='lure'?SYMIMG.ST:(b.id==='magnet'?SYMIMG.WD:SYMIMG.FS);
    h+='<div class="card"><img alt="" src="'+ic+'"><div class="grow"><h3>'+b.name+'</h3><p>'+b.desc+'</p></div>'+
      '<div role="button" tabindex="0" class="btn'+(SL.coins>=b.cost&&!BUSY?'':' off')+'" data-boost="'+b.id+'"><span class="price">'+fmt(b.cost)+' ●</span></div></div>';
  });
  h+='<p class="hint">Les pièces se gagnent au bandit manchot, en quêtes, et avec le cadeau du jour.</p>';
  $('#sbody').innerHTML=h;
}
async function chooseType(){
  return new Promise(function(res){
    var m=$('#modal'), h='<h2>CHOISIS UN TYPE</h2><div class="chips" style="justify-content:center">';
    TYPE_KEYS.forEach(function(t){var seen=0;h+='<span class="chip" data-t="'+t+'" style="background:'+T[t][2]+';color:'+(hex2l(T[t][2])>58?'#1c1530':'#fff')+'">'+T[t][0]+'</span>';});
    h+='</div><div role="button" tabindex="0" class="btn alt" id="mno">ANNULER</div>';
    m.innerHTML='<div class="mbox">'+h+'</div>'; m.hidden=false;
    m.onclick=function(e){var t=e.target.closest('[data-t]'); if(t){m.hidden=true;m.innerHTML='';m.onclick=null;res(t.getAttribute('data-t'));}
      else if(e.target.id==='mno'){m.hidden=true;m.innerHTML='';m.onclick=null;res(null);}};
  });
}
async function buyPack(p){
  if(BUSY||SL.coins<p.cost) {sfx('no');return;}
  var type=null;
  if(p.pickType){type=await chooseType(); if(!type) return;}
  BUSY=true; SL.coins-=p.cost; sfx('buy'); saveSL(); ui(); rerender();
  var out=[];
  try{
    for(var i=0;i<p.n;i++){
      out.push(await captureSeq({ball:p.ball,r:p.r,forceNew:p.forceNew,shiny:p.shiny,upgrade:p.upgrade,type:type,label:p.name.toUpperCase()+(p.n>1?' · '+(i+1)+'/'+p.n:''),quick:p.n>1}));
    }
  }catch(e){try{console.error(e);}catch(_){}}
  BUSY=false;
  if(out.length>1){
    var h='<h2>RÉSULTAT</h2><div class="dgrid" style="grid-template-columns:repeat(auto-fill,minmax(70px,1fr))">';
    out.forEach(function(o){h+='<div class="dcell" style="'+(o.shiny?'border-color:var(--gold2);box-shadow:0 0 8px var(--gold2)':'')+'">'+img(o.id,o.shiny)+(o.shiny?'<span class="star">✦</span>':'')+'<small>'+(o.isNew?'NEW':'')+'</small></div>';});
    h+='</div>';
    await modal(h);
  }
  ui(); rerender();
}
async function buyBoost(id){
  var b=BOOSTS.filter(function(x){return x.id===id;})[0];
  if(BUSY||SL.coins<b.cost){sfx('no');return;}
  SL.coins-=b.cost; sfx('buy');
  if(id==='lure') SL.lure+=20; else if(id==='magnet') SL.magnet+=15;
  saveSL(); ui();
  if(id==='fsbuy'){ closeSheet(); BUSY=true; try{await startFree(8,SL.bet);}finally{BUSY=false;} ui(); scheduleNext(); return; }
  rerender();
}
function renderQuests(){
  ensureQuests();
  var h='<p class="hint" style="text-align:left">Trois nouvelles quêtes chaque jour.'+(SL.streakDays>1?' Série de connexion : '+SL.streakDays+' jours.':'')+'</p>';
  SL.quests.forEach(function(q,i){
    var d=qDef(q.id), ok=q.p>=d.n;
    h+='<div class="card q'+(q.c?' done':'')+'"><div class="grow"><h3>'+d.t+'</h3><p>'+q.p+' / '+d.n+' · récompense '+d.r+' ●</p><div class="qbar"><i style="width:'+(q.p/d.n*100)+'%"></i></div></div>'+
      (q.c?'<b style="color:var(--good);font-family:var(--font-d);font-size:9px">FAIT</b>':'<div role="button" tabindex="0" class="btn'+(ok?' on':' off')+'" data-claim="'+i+'">RÉCUPÉRER</div>')+'</div>';
  });
  h+='<div class="sec">STATISTIQUES</div><div class="card"><p style="line-height:1.7">Tours joués : '+fmt(SL.spins)+'<br>Captures : '+fmt(SL.caps)+' ('+count(DEX.seen)+' différents)<br>Chromatiques : '+count(DEX.shiny)+'<br>Meilleur gain : '+fmt(SL.best)+' ●<br>FREE SPIN déclenchés : '+SL.fsRounds+'<br>Bonus aléatoires : '+SL.events+'</p></div>';
  $('#sbody').innerHTML=h;
}
function renderPay(){
  var h='<div class="sec">COMMENT JOUER</div><div class="card"><p>5 lignes (3 horizontales, 2 diagonales) sont toujours actives. Aligne <b style="color:var(--ink)">3 symboles identiques</b> : tu gagnes des pièces <b style="color:var(--ink)">et tu captures un Pokémon</b>. Le joker ? remplace tous les symboles sauf FREE SPIN et œuf.</p></div><div class="sec">SYMBOLES</div>';
  var rows=[['PB','3 alignées : ×1 · capture'],['GB','×2 · capture avec priorité aux nouveaux · paire ×1'],['UB','×6 · capture quasi toujours inédite · paire ×1'],['MB','×30 · Pokémon inédit garanti, chromatique 1/10'],['ST','×5 · capture avec chromatique 1/4'],
    ['FI','×2 · capture d\'un Pokémon Feu'],['WA','×2 · capture d\'un Pokémon Eau'],['GR','×2 · capture d\'un Pokémon Plante'],['EG','3 œufs n\'importe où : éclosion d\'un Pokémon inédit, chromatique 1/5'],['FS','3 FREE SPIN n\'importe où : 8 tours gratuits à thème de type'],['WD','Joker']];
  rows.forEach(function(r){h+='<div class="card"><img alt="" src="'+SYMIMG[r[0]]+'"><div class="grow"><h3>'+SYMNAME[r[0]]+'</h3><p>'+r[1]+'</p></div></div>';});
  h+='<div class="sec">BONUS ALÉATOIRES</div>';
  EVENTS.forEach(function(e){h+='<div class="card"><div class="grow"><h3>'+e.name+'</h3><p>'+e.desc+'</p></div></div>';});
  h+='<div class="sec">ET AUSSI</div><div class="card"><p style="line-height:1.6">COMBO : chaque tour gagnant d\'affilée ajoute +10 % de gains (jusqu\'à +100 %).<br>FREE SPIN : chromatiques ×2, multiplicateur ×1 à ×10, 5 tours de plus avec 3 nouveaux FREE SPIN.<br>Chromatique de base : 1 chance sur 25 à chaque capture.<br>Doublons : quelques pièces. Nouveaux : un peu plus. Chromatique inédit : +250. Tous les 25 Pokémon différents : +100.</p></div>';
  $('#sbody').innerHTML=h;
}
var CFILTER='all';
var GENS=[[1,151,'Kanto'],[152,251,'Johto'],[252,386,'Hoenn'],[387,493,'Sinnoh'],[494,649,'Unys'],[650,721,'Kalos'],[722,809,'Alola'],[810,905,'Galar'],[906,1025,'Paldea']];
function renderColl(){
  var n=count(DEX.seen), s=count(DEX.shiny);
  var h='<div class="card"><div class="grow"><h3>'+n+' / '+N+' capturés</h3><p>'+s+' chromatiques</p></div></div><div class="gens">';
  GENS.forEach(function(g){var c=0,hi=Math.min(g[1],N);for(var i=g[0];i<=hi;i++) if(DEX.seen[i]) c++; h+='<div class="gen"><b>'+g[2]+'</b> '+c+'/'+(hi-g[0]+1)+'</div>';});
  h+='</div><div class="chips"><span class="btn sm '+(CFILTER==='all'?'on':'alt')+'" data-f="all">TOUS</span><span class="btn sm '+(CFILTER==='shiny'?'on':'alt')+'" data-f="shiny">✦ CHROMA</span><span class="btn sm '+(CFILTER==='miss'?'on':'alt')+'" data-f="miss">MANQUANTS</span></div><div class="dgrid">';
  for(var id=1;id<=N;id++){
    var sn=!!DEX.seen[id], sh=!!DEX.shiny[id];
    if(CFILTER==='shiny'&&!sh) continue; if(CFILTER==='miss'&&sn) continue;
    h+='<div role="button" tabindex="0" class="dcell'+(sn?'':' un')+'" data-id="'+id+'"><small>'+id+'</small>'+(sh?'<span class="star">✦</span>':'')+(sn?img(id,CFILTER==='shiny'):'<span>?</span>')+'</div>';
  }
  h+='</div>';
  $('#sbody').innerHTML=h;
}
async function showMon(id){
  if(!DEX.seen[id]) return;
  var info=await getInfo(id), sh=!!DEX.shiny[id];
  await modal('<h2 style="font-size:13px">N°'+('000'+id).slice(-3)+' '+esc(info.name)+'</h2><div style="display:flex;gap:8px;justify-content:center"><img alt="" style="width:120px;height:120px" src="'+spriteURL(id,false)+'" onerror="__fb(this)">'+(sh?'<img alt="" style="width:120px;height:120px" src="'+spriteURL(id,true)+'" onerror="__fb(this)">':'')+'</div><p>'+(info.types||[]).map(chip).join(' ')+'</p><p style="color:var(--mute);font-size:12px">'+(sh?'Chromatique obtenu ✦':'Chromatique pas encore obtenu')+'</p>');
}

/* ---------- Cadeau du jour ---------- */
function dstr(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
async function checkDaily(){
  var t=today(); if(SL.daily===t) return;
  var streak=(SL.daily===dstr(new Date(Date.now()-864e5)))?(SL.streakDays||0)+1:1;
  SL.streakDays=streak; SL.daily=t;
  var coins=100+50*Math.min(streak-1,6); SL.coins+=coins; saveSL(); ui();
  sfx('bonus'); coinRain(20);
  await modal('<h2>CADEAU DU JOUR</h2><div class="big">+'+coins+' ●</div><p>Jour '+streak+' de connexion'+(streak>1?' d\'affilée':'')+' — reviens demain pour plus !</p><p>+ une rencontre offerte</p>');
  BUSY=true;
  try{await captureSeq({ball:'PB',r:3,shiny:1/15,label:'CADEAU DU JOUR'});}catch(e){}
  BUSY=false; ui(); scheduleNext();
}

/* ---------- Démarrage ---------- */
function click(id,f){var e=$(id); e.onclick=f;}
click('#spin',function(){ if(!BUSY&&!sheetOpen&&$('#modal').hidden&&$('#cap').hidden) doSpin(); });
click('#bPlus',function(){ if(BUSY||SL.fs>0) return; var i=BETS.indexOf(SL.bet); if(i<0)i=0; if(i<BETS.length-1&&BETS[i+1]<=SL.coins){SL.bet=BETS[i+1];sfx('tick');} else sfx('no'); ui(); });
click('#bMinus',function(){ if(BUSY||SL.fs>0) return; var i=BETS.indexOf(SL.bet); if(i>0){SL.bet=BETS[i-1];sfx('tick');} ui(); });
click('#bAuto',function(){ SL.auto=SL.auto?0:1; ui(); scheduleNext(); });
click('#bTurbo',function(){ SL.turbo=SL.turbo?0:1; ui(); });
click('#bSnd',function(){ SOUND=SOUND?0:1; lsSetNow('poke-slots-sound',SOUND); if(SOUND&&!AC) unlockAudio(); else applyMusic(); ui(); });
click('#nShop',function(){ openSheet('BOUTIQUE',function(){renderShop();$('#scoins').textContent=fmt(SL.coins)+' ●';}); });
click('#nColl',function(){ openSheet('POKÉDEX',function(){renderColl();$('#scoins').textContent=count(DEX.seen)+'/'+N;}); });
click('#nQuest',function(){ openSheet('QUÊTES',function(){renderQuests();$('#scoins').textContent=fmt(SL.coins)+' ●';}); });
click('#nPay',function(){ openSheet('GAINS',function(){renderPay();$('#scoins').textContent='';}); });
click('#sBack',closeSheet);
$('#sbody').addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-buy]'))){var p=PACKS.filter(function(x){return x.id===t.getAttribute('data-buy');})[0]; buyPack(p);}
  else if((t=e.target.closest('[data-boost]'))){buyBoost(t.getAttribute('data-boost'));}
  else if((t=e.target.closest('[data-claim]'))){var q=SL.quests[+t.getAttribute('data-claim')]; if(q&&!q.c&&q.p>=qDef(q.id).n){q.c=1;SL.coins+=qDef(q.id).r;sfx('big');coinRain(20);saveSL();ui();rerender();}}
  else if((t=e.target.closest('[data-f]'))){CFILTER=t.getAttribute('data-f');rerender();}
  else if((t=e.target.closest('[data-id]'))){showMon(+t.getAttribute('data-id'));}
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click();return;}
  if(e.key===' '&&!BUSY&&!sheetOpen&&$('#modal').hidden&&$('#cap').hidden){e.preventDefault();doSpin();}
});
window.addEventListener('pagehide',saveSL);

window.__SLOTS={SL:function(){return SL;},DEX:function(){return DEX;},doSpin:doSpin,evalGrid:evalGrid,spinGrid:spinGrid,captureSeq:captureSeq,
  force:function(g){FORCE=g;},startFree:startFree,busy:function(){return BUSY;},buyPack:buyPack,PACKS:PACKS};

initReels(); ensureQuests(); ui(); setCoinsShown(SL.coins);
initN().then(function(){ui();});
checkDaily();
})();
</script>
